<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Canada Civ</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<canvas id="map" aria-label="Map of Canada"></canvas>
<header><div class="brand"><span class="leaf" aria-hidden="true">✦</span><b>CANADA CIV</b></div><div id="yields" class="yields"></div><div class="header-right"><span class="tag" id="vintage"></span><button id="searchButton">⌕</button><button id="shareButton"></button><button id="almanacButton"></button><button id="lang">FR</button><button id="help">?</button></div></header>
<div id="loading">Surveying the land…</div>
<div class="lens-dock"><div id="quickLenses"></div><label id="lensLabel" for="lensSelect"></label><select id="lensSelect"></select></div><div id="legend" hidden></div>
<aside id="panel" hidden></aside>
<div class="minimap-frame"><canvas id="minimap" tabindex="0" width="200" height="164" aria-label="Overview map"></canvas></div>
<div class="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="home" aria-label="Reset view">⌂</button></div>
<footer><span id="hint"></span><span id="credit">Statistics Canada · Natural Resources Canada · NOAA · Natural Earth</span></footer>
<div id="modal" hidden><div class="modal-card"><button id="modalClose" class="close">×</button><div id="modalContent"></div></div></div>
<script type="module" src="js/main.js"></script></body></html>
